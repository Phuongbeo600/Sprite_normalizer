# Cấu hình tự động cho Railway Nixpacks Builder (Hỗ trợ song song Python 3.11 và Node.js)
[phases.setup]
nixPkgs = ["python311", "nodejs_22"]

[phases.install]
cmds = [
  "python -m pip install --no-cache-dir -r backend/requirements.txt",
  "npm --prefix frontend ci"
]

[phases.build]
cmds = [
  "npm --prefix frontend run build"
]

[start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
